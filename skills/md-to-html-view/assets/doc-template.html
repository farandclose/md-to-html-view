<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --paper: #fafbfc;
      --ink: #202124;
      --muted: #5f6368;
      --rule: #dadce0;
      --table: #f1f3f4;
      --accent: #1a73e8;
      --shadow: 0 1px 2px rgba(60, 64, 67, 0.16), 0 2px 6px rgba(60, 64, 67, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.62;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 56px;
      padding: 10px 24px;
      background: #fff;
      border-bottom: 1px solid var(--rule);
    }

    .doc-icon {
      display: grid;
      place-items: center;
      flex: 0 0 28px;
      width: 28px;
      height: 34px;
      color: #fff;
      background: var(--accent);
      border-radius: 3px;
      font-weight: 700;
      font-size: 18px;
    }

    .title-wrap {
      min-width: 0;
    }

    .title {
      overflow: hidden;
      max-width: 820px;
      color: #3c4043;
      font-size: 18px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    main {
      padding: 34px 16px 56px;
    }

    .paper {
      width: min(100%, 816px);
      min-height: 1056px;
      margin: 0 auto;
      padding: 76px 84px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    h1,
    h2,
    h3,
    h4 {
      margin: 1.45em 0 0.45em;
      color: var(--ink);
      line-height: 1.25;
      font-weight: 500;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      font-weight: 400;
    }

    h2 {
      padding-top: 0.2em;
      border-top: 1px solid #eef0f2;
      font-size: 20px;
    }

    h3 {
      font-size: 16px;
      font-weight: 600;
    }

    h4 {
      color: #3c4043;
      font-size: 14px;
      font-weight: 600;
    }

    p {
      margin: 0 0 0.8em;
    }

    hr {
      height: 1px;
      margin: 24px 0;
      border: 0;
      background: var(--rule);
    }

    ul,
    ol {
      margin: 0.35em 0 1em 1.45em;
      padding: 0;
    }

    li {
      margin: 0.18em 0;
      padding-left: 0.1em;
    }

    blockquote {
      margin: 1em 0;
      padding: 8px 0 8px 16px;
      border-left: 3px solid var(--accent);
      color: #3c4043;
      background: #f8fbff;
    }

    table {
      width: 100%;
      margin: 1em 0 1.2em;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
      line-height: 1.42;
    }

    th,
    td {
      padding: 8px 9px;
      border: 1px solid var(--rule);
      vertical-align: top;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    th {
      background: var(--table);
      color: #3c4043;
      font-weight: 600;
      text-align: left;
    }

    code {
      padding: 1px 4px;
      border-radius: 3px;
      background: #f1f3f4;
      color: #3c4043;
      font-family: "Roboto Mono", Consolas, monospace;
      font-size: 0.92em;
    }

    strong {
      font-weight: 700;
    }

    em {
      color: #4d5156;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 760px) {
      .topbar {
        padding: 10px 14px;
      }

      main {
        padding: 14px 0 32px;
      }

      .paper {
        width: 100%;
        min-height: auto;
        padding: 34px 22px 46px;
        box-shadow: none;
      }

      table {
        display: block;
        overflow-x: auto;
        table-layout: auto;
        white-space: nowrap;
      }

      th,
      td {
        min-width: 140px;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .topbar {
        display: none;
      }

      main {
        padding: 0;
      }

      .paper {
        width: auto;
        min-height: auto;
        padding: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <header class="topbar" aria-label="Document header">
    <div class="doc-icon" aria-hidden="true">D</div>
    <div class="title-wrap">
      <div class="title">{{TITLE}}</div>
      <div class="subtitle">Read-only render of file: {{SOURCE_PATH}}</div>
    </div>
  </header>
  <main>
    <article class="paper" id="document"></article>
  </main>

  <script type="text/plain" id="markdown-source"></script>

  <script>
    const source = document.getElementById("markdown-source").textContent.trim();
    const target = document.getElementById("document");

    const escapeHtml = (value) => value
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

    const inline = (value) => escapeHtml(value)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/_([^_]+)_/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

    const splitTableRow = (line) => line
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((cell) => cell.trim());

    const isTableDivider = (line) => /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line);

    const renderMarkdown = (source) => {
      const lines = source.trim().split(/\r?\n/);
      const html = [];
      let paragraph = [];
      let list = null;

      const flushParagraph = () => {
        if (!paragraph.length) return;
        html.push(`<p>${inline(paragraph.join(" ").replace(/ {2,}/g, " "))}</p>`);
        paragraph = [];
      };

      const closeList = () => {
        if (!list) return;
        html.push(`</${list}>`);
        list = null;
      };

      for (let i = 0; i < lines.length; i += 1) {
        const raw = lines[i];
        const line = raw.trim();

        if (!line) {
          flushParagraph();
          closeList();
          continue;
        }

        if (line === "---") {
          flushParagraph();
          closeList();
          html.push("<hr>");
          continue;
        }

        if (line.startsWith("|") && lines[i + 1] && isTableDivider(lines[i + 1].trim())) {
          flushParagraph();
          closeList();
          const headers = splitTableRow(line);
          i += 1;
          const rows = [];
          while (lines[i + 1] && lines[i + 1].trim().startsWith("|")) {
            i += 1;
            rows.push(splitTableRow(lines[i]));
          }
          html.push("<table><thead><tr>");
          headers.forEach((header) => html.push(`<th>${inline(header)}</th>`));
          html.push("</tr></thead><tbody>");
          rows.forEach((row) => {
            html.push("<tr>");
            row.forEach((cell) => html.push(`<td>${inline(cell)}</td>`));
            html.push("</tr>");
          });
          html.push("</tbody></table>");
          continue;
        }

        const heading = line.match(/^(#{1,4})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          closeList();
          const level = heading[1].length;
          html.push(`<h${level}>${inline(heading[2])}</h${level}>`);
          continue;
        }

        if (line.startsWith("&gt;") || line.startsWith(">")) {
          flushParagraph();
          closeList();
          html.push(`<blockquote>${inline(line.replace(/^(&gt;|>)\s*/, ""))}</blockquote>`);
          continue;
        }

        const unordered = line.match(/^-\s+(.+)$/);
        if (unordered) {
          flushParagraph();
          if (list !== "ul") {
            closeList();
            html.push("<ul>");
            list = "ul";
          }
          html.push(`<li>${inline(unordered[1])}</li>`);
          continue;
        }

        const ordered = line.match(/^\d+\.\s+(.+)$/);
        if (ordered) {
          flushParagraph();
          if (list !== "ol") {
            closeList();
            html.push("<ol>");
            list = "ol";
          }
          html.push(`<li>${inline(ordered[1])}</li>`);
          continue;
        }

        closeList();
        paragraph.push(line.replace(/\s{2}$/, ""));
      }

      flushParagraph();
      closeList();
      return html.join("\n");
    };

    target.innerHTML = renderMarkdown(source);
  </script>
</body>
</html>
